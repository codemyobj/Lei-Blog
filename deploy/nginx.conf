# ============================================================
# Lei-Blog — Nginx 配置
#
# 用法：
#   1. 把本文件复制到服务器 /etc/nginx/conf.d/lei-blog.conf
#   2. 替换模板变量（__DOMAIN__）为你的真实域名：
#        sed -i 's/__DOMAIN__/example.com/g' /etc/nginx/conf.d/lei-blog.conf
#   3. nginx -t && systemctl reload nginx
#
# ⚠️ 模板变量只有 __DOMAIN__ 一个。证书路径由 acme.sh 固定生成到
#    /etc/letsencrypt/live/<域名>/，所以会随 __DOMAIN__ 一并替换。
# ============================================================

# ---------- HTTP → HTTPS 301 ----------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # acme.sh HTTP-01 校验目录（必须放行，否则证书续期会失败）
    location /.well-known/acme-challenge/ {
        root /opt/lei-blog/client/dist;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;

    # ---------- TLS ----------
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 安全头 ----------
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /opt/lei-blog/client/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后台编辑长 Markdown 正文 / 图片 URL
    client_max_body_size 10m;

    # ---------- 1) API 反向代理 → PM2 常驻 Node ----------
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # 阅读量 +1 是 fire-and-forget，开启缓冲避免拖慢响应
        proxy_buffering on;
    }

    # ---------- 2) 带哈希的静态资源：长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 3) SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不长缓存，否则发版后用户拿不到新入口
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
