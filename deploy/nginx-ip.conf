# ============================================================
# Lei-Blog — Nginx 配置（第一阶段：未备案 / 纯 IP + HTTP）
#
# 与 deploy/nginx.conf 的差别：**没有 443 / TLS / HSTS**。
# 未备案时域名无法解析到境内服务器，Let's Encrypt 的 HTTP-01 校验也要求
# 域名可访问，所以此阶段只能走 http://<公网IP>。
#
# 用法：
#   cp deploy/nginx-ip.conf /etc/nginx/sites-available/lei-blog
#   ln -sf /etc/nginx/sites-available/lei-blog /etc/nginx/sites-enabled/lei-blog
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# 备案通过后改用 deploy/nginx.conf（443 + acme.sh 证书）。
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/lei-blog/client/dist;
    index index.html;

    # 后台编辑长 Markdown 正文 / 图片 URL
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 无 TLS 时没有 HSTS（浏览器会忽略 / 会误伤后续上 HTTPS）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 1) API 反向代理 → PM2 常驻 Node ----------
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # ---------- 2) 带哈希的静态资源：长缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 3) SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不长缓存，否则发版后用户拿不到新入口
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
